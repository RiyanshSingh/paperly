  <body>
    <div id="error-log" style="color: red; padding: 20px; font-family: monospace; white-space: pre-wrap; z-index: 9999; position: relative;"></div>
    <script>
      window.addEventListener('error', function(event) {
        document.getElementById('error-log').textContent += event.message + '\n' + (event.error ? event.error.stack : '') + '\n\n';
      });
      window.addEventListener('unhandledrejection', function(event) {
        document.getElementById('error-log').textContent += 'Unhandled promise rejection: ' + event.reason + '\n\n';
      });
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
